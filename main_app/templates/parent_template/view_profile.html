{% extends 'main_app/base.html' %}
{% load static %}
{% block title %}Parent Profile{% endblock %}
{% block page_title %}My Profile{% endblock %}

{% block content %}
<div style="padding: 2rem; max-width: 900px; margin: 0 auto;">
    <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 2rem;">
        <i class="fas fa-user"></i> Parent Profile
    </h2>

    <div style="background: white; border-radius: 12px; padding: 2rem;">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="row">
                <div class="col-md-6" style="margin-bottom: 1.5rem;">
                    <label class="form-label">First Name *</label>
                    <input type="text" name="first_name" class="form-control" required 
                           value="{{ user.first_name }}">
                </div>
                <div class="col-md-6" style="margin-bottom: 1.5rem;">
                    <label class="form-label">Last Name *</label>
                    <input type="text" name="last_name" class="form-control" required 
                           value="{{ user.last_name }}">
                </div>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label class="form-label">Email *</label>
                <input type="email" name="email" class="form-control" required 
                       value="{{ user.email }}">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label class="form-label">Mobile Number</label>
                <input type="text" name="mobile" class="form-control" 
                       value="{{ parent.mobile|default:'' }}" placeholder="+91 1234567890">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label class="form-label">Occupation</label>
                <input type="text" name="occupation" class="form-control" 
                       value="{{ parent.occupation|default:'' }}">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label class="form-label">Address</label>
                <textarea name="address" class="form-control" rows="3">{{ parent.address|default:'' }}</textarea>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label class="form-label">Profile Picture</label>
                <input type="file" name="profile_pic" class="form-control" accept="image/*">
                {% if user.profile_pic %}
                <img src="{{ user.profile_pic.url }}" alt="Profile" style="width: 100px; height: 100px; border-radius: 50%; margin-top: 1rem;">
                {% endif %}
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label class="form-label">New Password (leave blank to keep current)</label>
                <input type="password" name="password" class="form-control" 
                       placeholder="Enter new password if you want to change">
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Update Profile
            </button>
        </form>
    </div>
</div>

<style>
    .form-label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    .form-control { width: 100%; padding: 0.75rem; border: 2px solid #e2e8f0; border-radius: 8px; }
    .btn { padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
    .btn-primary { background: #1e40af; color: white; }
</style>
{% endblock content %}
