{% extends 'main_app/base.html' %}
{% load static %}
{% block title %}Send Message{% endblock %}
{% block page_title %}Send Message to Faculty{% endblock %}

{% block content %}
<div style="padding: 2rem; max-width: 800px; margin: 0 auto;">
    <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 2rem;">
        <i class="fas fa-envelope"></i> Send Message
    </h2>

    <div style="background: white; border-radius: 12px; padding: 2rem;">
        <form method="post">
            {% csrf_token %}
            
            <div style="margin-bottom: 1.5rem;">
                <label class="form-label">Regarding Child *</label>
                <select name="student" class="form-control" required>
                    <option value="">-- Select Child --</option>
                    {% for child in children %}
                    <option value="{{ child.id }}">
                        {{ child.admin.first_name }} {{ child.admin.last_name }} - {{ child.roll_number }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label class="form-label">Send To *</label>
                <select name="receiver" class="form-control" required>
                    <option value="">-- Select Recipient --</option>
                    <optgroup label="Faculty">
                        {% for staff in faculty %}
                        <option value="{{ staff.admin.id }}">
                            {{ staff.admin.first_name }} {{ staff.admin.last_name }} ({{ staff.department.name|default:"Faculty" }})
                        </option>
                        {% endfor %}
                    </optgroup>
                    <optgroup label="Administration">
                        {% for hod in hods %}
                        <option value="{{ hod.id }}">{{ hod.first_name }} {{ hod.last_name }} (HOD)</option>
                        {% endfor %}
                    </optgroup>
                </select>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label class="form-label">Subject *</label>
                <input type="text" name="subject" class="form-control" required 
                       placeholder="Enter message subject">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label class="form-label">Message *</label>
                <textarea name="message" class="form-control" rows="6" required 
                          placeholder="Type your message here..."></textarea>
            </div>

            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i> Send Message
                </button>
                <a href="{% url 'parent_home' %}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<style>
    .form-label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    .form-control { width: 100%; padding: 0.75rem; border: 2px solid #e2e8f0; border-radius: 8px; }
    .btn { padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; border: none; cursor: pointer; }
    .btn-primary { background: #1e40af; color: white; }
    .btn-secondary { background: #e2e8f0; color: #0f172a; }
</style>
{% endblock content %}
