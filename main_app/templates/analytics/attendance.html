{% extends "main_app/base.html" %}
{% load static %}
{% block page_title %}Attendance Analytics{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <h2 class="text-2xl font-bold text-gray-900 mb-2">
            <i class="fas fa-chart-bar mr-2"></i>Attendance Analytics
        </h2>
        <p class="text-gray-600">Detailed attendance insights and trends</p>
    </div>

    <div class="grid lg:grid-cols-2 gap-6">
        <div class="dashboard-card">
            <div class="dashboard-card-header">
                <h3 class="dashboard-card-title">Daily Attendance</h3>
            </div>
            <div class="dashboard-card-body">
                <canvas id="dailyChart" height="300"></canvas>
            </div>
        </div>

        <div class="dashboard-card">
            <div class="dashboard-card-header">
                <h3 class="dashboard-card-title">Subject-wise Attendance</h3>
            </div>
            <div class="dashboard-card-body">
                <canvas id="subjectChart" height="300"></canvas>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block custom_js %}
<script>
new Chart(document.getElementById('dailyChart'), {
    type: 'line',
    data: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
        datasets: [{
            label: 'Present',
            data: [920, 950, 880, 940, 910],
            borderColor: '#10b981',
            tension: 0.4
        }]
    }
});

new Chart(document.getElementById('subjectChart'), {
    type: 'bar',
    data: {
        labels: ['Math', 'Physics', 'Chemistry', 'English', 'CS'],
        datasets: [{
            label: 'Attendance %',
            data: [85, 88, 82, 90, 87],
            backgroundColor: '#3b82f6'
        }]
    }
});
</script>
{% endblock %}
