{% extends 'forms/base_form.html' %}
{% load static %}

{% block form_content %}
<!-- Dynamic form fields will be rendered here -->
{% for field in form %}
    <div class="form-group mb-2">
        {{field.errors}}
        <label for="{{field.id_for_label}}">
            {{field.label}}
            {% if field.field.required %}<span class="required-field">*</span>{% endif %}
        </label>
        {{field}}
    </div>
{% endfor %}
{% endblock form_content %}
