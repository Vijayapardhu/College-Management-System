{% extends 'main_app/base.html' %}
{% load static %}
{% block page_title %}Manage Placement Drives{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <div class="flex items-center justify-between">
            <div>
                <h2 class="text-2xl font-bold text-gray-900 mb-2">
                    <i class="fas fa-briefcase mr-2"></i>Placement Drives
                </h2>
                <p class="text-gray-600">Schedule and manage campus recruitment</p>
            </div>
            <a href="{% url 'add_placement_drive' %}" class="btn btn-primary">
                <i class="fas fa-plus mr-2"></i>Add Drive
            </a>
        </div>
    </div>

    <div class="grid md:grid-cols-3 gap-6">
        <div class="dashboard-card">
            <div class="dashboard-card-body p-6">
                <div class="text-center">
                    <div class="text-3xl mb-3">📅</div>
                    <h4 class="font-semibold text-gray-900 mb-2">Tech Corp Drive</h4>
                    <p class="text-sm text-gray-600 mb-3">Nov 25, 2024</p>
                    <span class="badge badge-primary">Upcoming</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
