{% extends "main_app/base.html" %}
{% load static %}
{% block page_title %}Timetable Conflicts{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <h2 class="text-2xl font-bold text-gray-900 mb-2">
            <i class="fas fa-exclamation-triangle mr-2"></i>Timetable Conflicts
        </h2>
        <p class="text-gray-600">Detect and resolve scheduling conflicts</p>
    </div>

    <div class="dashboard-card">
        <div class="dashboard-card-header">
            <h3 class="dashboard-card-title">Conflict Detection</h3>
        </div>
        <div class="dashboard-card-body">
            <div class="alert alert-success">
                <i class="fas fa-check-circle mr-2"></i>
                No conflicts detected! All schedules are optimized.
            </div>
        </div>
    </div>
</div>
{% endblock %}
