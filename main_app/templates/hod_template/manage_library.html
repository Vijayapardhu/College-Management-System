{% extends "main_app/base.html" %}
{% load static %}
{% block page_title %}Library Management{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <h2 class="text-2xl font-bold text-gray-900 mb-2"><i class="fas fa-book mr-2"></i>Library Management</h2>
        <p class="text-gray-600">Manage books and resources</p>
    </div>
    <div class="grid md:grid-cols-4 gap-6">
        <div class="metric-card metric-card-primary"><div class="metric-value" data-count="5200">0</div><div class="metric-label">Total Books</div></div>
        <div class="metric-card metric-card-success"><div class="metric-value" data-count="850">0</div><div class="metric-label">Issued</div></div>
        <div class="metric-card metric-card-info"><div class="metric-value" data-count="4350">0</div><div class="metric-label">Available</div></div>
        <div class="metric-card metric-card-warning"><div class="metric-value" data-count="25">0</div><div class="metric-label">Overdue</div></div>
    </div>
</div>
{% endblock %}

{% block custom_js %}
<script>
document.querySelectorAll('[data-count]').forEach(counter => {
    const target = parseInt(counter.getAttribute('data-count'));
    let current = 0;
    const timer = setInterval(() => {
        current += target / 60;
        if (current >= target) {
            counter.textContent = target;
            clearInterval(timer);
        } else {
            counter.textContent = Math.floor(current);
        }
    }, 16);
});
</script>
{% endblock %}
