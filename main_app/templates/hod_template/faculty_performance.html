{% extends 'main_app/base.html' %}
{% load static %}
{% block page_title %}Faculty Performance{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <h2 class="text-2xl font-bold text-gray-900 mb-2"><i class="fas fa-chart-line mr-2"></i>Faculty Performance</h2>
        <p class="text-gray-600">Track faculty productivity and student feedback</p>
    </div>
    <div class="grid md:grid-cols-4 gap-6">
        <div class="metric-card metric-card-primary"><div class="metric-value">4.5/5</div><div class="metric-label">Avg Rating</div></div>
        <div class="metric-card metric-card-success"><div class="metric-value" data-count="92">0</div><div class="metric-label">Pass Rate %</div></div>
        <div class="metric-card metric-card-info"><div class="metric-value" data-count="85">0</div><div class="metric-label">Total Faculty</div></div>
        <div class="metric-card metric-card-warning"><div class="metric-value" data-count="320">0</div><div class="metric-label">Lectures/Month</div></div>
    </div>
</div>
{% endblock content %}
