{% extends 'main_app/base.html' %}
{% load static %}
{% block page_title %}{{ page_title }}{% endblock page_title %}

{% block content %}
<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Create New Event</h3>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="card-body">
                            <div class="form-group">
                                <label>Event Title *</label>
                                <input type="text" name="title" class="form-control" placeholder="E.g., Tech Fest 2025" required>
                            </div>

                            <div class="form-group">
                                <label>Description *</label>
                                <textarea name="description" class="form-control" rows="4" placeholder="Event description..." required></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label>Event Date & Time *</label>
                                        <input type="datetime-local" name="event_date" class="form-control" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label>Venue *</label>
                                        <input type="text" name="venue" class="form-control" placeholder="E.g., Main Auditorium" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label>Course (Optional)</label>
                                        <select name="course" class="form-control">
                                            <option value="">-- All Courses --</option>
                                            {% for course in courses %}
                                            <option value="{{ course.id }}">{{ course.name }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label>Max Participants (0 = Unlimited)</label>
                                        <input type="number" name="max_participants" class="form-control" value="0" min="0">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Create Event
                            </button>
                            <a href="{% url 'admin_view_events' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
