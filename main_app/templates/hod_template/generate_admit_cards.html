{% extends "main_app/base.html" %}
{% load static %}
{% block page_title %}Generate Admit Cards{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <h2 class="text-2xl font-bold text-gray-900 mb-2">
            <i class="fas fa-id-card mr-2"></i>Generate Admit Cards
        </h2>
        <p class="text-gray-600">Create admit cards for examinations</p>
    </div>

    <div class="form-container">
        <form class="space-y-6">
            <div class="form-group">
                <label class="form-label">Select Exam</label>
                <select class="form-select">
                    <option>Mid-Term Exam - Nov 2024</option>
                    <option>Final Exam - Dec 2024</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Select Course</label>
                <select class="form-select">
                    <option>B.Tech CSE</option>
                    <option>B.Tech ECE</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-file-download mr-2"></i>Generate Admit Cards
            </button>
        </form>
    </div>
</div>
{% endblock %}
