{% extends 'main_app/base.html' %}
{% load static %}
{% block page_title %}Classroom Bookings{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <div class="flex items-center justify-between">
            <div>
                <h2 class="text-2xl font-bold text-gray-900 mb-2">
                    <i class="fas fa-calendar-check mr-2"></i>Classroom Bookings
                </h2>
                <p class="text-gray-600">View and manage room reservations</p>
            </div>
            <a href="{% url 'book_classroom' %}" class="btn btn-primary">
                <i class="fas fa-plus mr-2"></i>New Booking
            </a>
        </div>
    </div>

    <div class="dashboard-card">
        <div class="dashboard-card-header">
            <h3 class="dashboard-card-title">Today's Bookings</h3>
        </div>
        <div class="dashboard-card-body">
            <div class="space-y-3">
                <div class="flex items-center justify-between p-4 bg-blue-50 rounded-lg">
                    <div>
                        <h4 class="font-semibold text-gray-900">Room 101 - Seminar</h4>
                        <p class="text-sm text-gray-600">2:00 PM - 4:00 PM | Dr. Smith</p>
                    </div>
                    <span class="badge badge-primary">Active</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
