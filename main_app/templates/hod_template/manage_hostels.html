{% extends "main_app/base.html" %}
{% load static %}
{% block page_title %}Hostel Management{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <div class="flex items-center justify-between">
            <div>
                <h2 class="text-2xl font-bold text-gray-900 mb-2"><i class="fas fa-hotel mr-2"></i>Hostel Management</h2>
                <p class="text-gray-600">Manage hostel allocations and facilities</p>
            </div>
            <button class="btn btn-primary"><i class="fas fa-plus mr-2"></i>Add Hostel</button>
        </div>
    </div>
    <div class="grid md:grid-cols-3 gap-6">
        <div class="metric-card metric-card-primary"><div class="metric-value" data-count="450">0</div><div class="metric-label">Total Beds</div></div>
        <div class="metric-card metric-card-success"><div class="metric-value" data-count="380">0</div><div class="metric-label">Occupied</div></div>
        <div class="metric-card metric-card-info"><div class="metric-value" data-count="70">0</div><div class="metric-label">Available</div></div>
    </div>
</div>
{% endblock %}
