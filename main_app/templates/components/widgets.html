<!-- Widget Components -->
<div class="grid md:grid-cols-3 gap-6">
    <!-- Metric Widget -->
    <div class="metric-card metric-card-primary">
        <div class="metric-icon metric-icon-primary">
            <i class="fas fa-{{ icon|default:'chart-line' }}"></i>
        </div>
        <div class="metric-value">{{ value|default:"0" }}</div>
        <div class="metric-label">{{ label|default:"Metric" }}</div>
    </div>
    
    <!-- Action Card Widget -->
    <div class="action-card">
        <div class="action-card-icon bg-gradient-to-br from-blue-100 to-blue-200">
            <span class="text-3xl">{{ emoji|default:"📊" }}</span>
        </div>
        <h3 class="text-lg font-bold text-gray-900 mb-2">{{ title|default:"Action" }}</h3>
        <p class="text-sm text-gray-600">{{ description|default:"Description" }}</p>
    </div>
    
    <!-- Info Card Widget -->
    <div class="dashboard-card">
        <div class="dashboard-card-header">
            <h3 class="dashboard-card-title">{{ card_title|default:"Information" }}</h3>
        </div>
        <div class="dashboard-card-body">
            {{ card_content|default:"Content goes here" }}
        </div>
    </div>
</div>
