<!-- Enhanced Table Component -->
<div class="dashboard-card">
    <div class="dashboard-card-header">
        <h3 class="dashboard-card-title">{{ table_title|default:"Data Table" }}</h3>
        <div class="flex items-center space-x-2">
            <input type="text" placeholder="Search..." class="form-input text-sm w-48">
            <button class="btn btn-outline btn-sm"><i class="fas fa-filter"></i></button>
        </div>
    </div>
    <div class="dashboard-card-body p-0">
        <div class="overflow-x-auto">
            <table class="modern-table w-full">
                {% block table_content %}
                <thead>
                    <tr>
                        <th class="px-6 py-3">Column 1</th>
                        <th class="px-6 py-3">Column 2</th>
                        <th class="px-6 py-3">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="px-6 py-4">Sample Data</td>
                        <td class="px-6 py-4">Sample Data</td>
                        <td class="px-6 py-4"><button class="btn btn-sm btn-primary"><i class="fas fa-eye"></i></button></td>
                    </tr>
                </tbody>
                {% endblock %}
            </table>
        </div>
    </div>
</div>
