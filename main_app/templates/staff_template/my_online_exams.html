{% extends "main_app/base.html" %}
{% load static %}
{% block page_title %}My Online Exams{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <div class="flex items-center justify-between">
            <div>
                <h2 class="text-2xl font-bold text-gray-900 mb-2">
                    <i class="fas fa-laptop mr-2"></i>My Online Exams
                </h2>
                <p class="text-gray-600">Manage your online examinations</p>
            </div>
            <a href="{% url 'create_online_exam' %}" class="btn btn-primary">
                <i class="fas fa-plus mr-2"></i>Create Exam
            </a>
        </div>
    </div>

    <div class="grid md:grid-cols-3 gap-6">
        <div class="dashboard-card">
            <div class="dashboard-card-body text-center p-8">
                <div class="text-4xl mb-3">📝</div>
                <h3 class="text-lg font-bold text-gray-900 mb-2">Create New Exam</h3>
                <a href="{% url 'create_online_exam' %}" class="btn btn-primary btn-sm mt-3">Get Started</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
