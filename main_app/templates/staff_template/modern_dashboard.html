{% extends "main_app/base.html" %}
{% load static %}

{% block title %}Faculty Dashboard - EduVision{% endblock %}

{% block custom_css %}
<style>
    body { background: #0a0a0a; }
<style>
    .dashboard-card {
        background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        border: none;
        border-radius: 15px;
        color: white;
        transition: all 0.3s ease;
        overflow: hidden;
        position: relative;
    }

    .dashboard-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    .dashboard-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(45deg, rgba(255,255,255,0.1) 0%, transparent 100%);
        pointer-events: none;
    }

    .dashboard-card .card-body {
        position: relative;
        z-index: 2;
    }

    .metric-icon {
        font-size: 3rem;
        opacity: 0.3;
        position: absolute;
        top: 20px;
        right: 20px;
    }

    .metric-value {
        font-size: 2.5rem;
        font-weight: 700;
        margin: 0;
    }

    .metric-label {
        font-size: 1rem;
        opacity: 0.9;
        margin: 0;
    }

    .chart-container {
        background: linear-gradient(135deg, #1a1a1a 0%, #262626 100%); border: 1px solid #333;
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        margin-bottom: 20px;
    }

    .quick-action-btn {
        background: linear-gradient(135deg, #1a1a1a 0%, #262626 100%); border: 1px solid #333;
        border: 2px solid #e9ecef;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        transition: all 0.3s ease;
        text-decoration: none;
        color: #495057;
        display: block;
    }

    .quick-action-btn:hover {
        border-color: #007bff;
        color: #007bff;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,123,255,0.1);
    }

    .quick-action-btn i {
        font-size: 2rem;
        margin-bottom: 10px;
        display: block;
    }

    .pending-tasks {
        background: linear-gradient(135deg, #1a1a1a 0%, #262626 100%); border: 1px solid #333;
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .task-item {
        display: flex;
        align-items: center;
        padding: 15px 0;
        border-bottom: 1px solid #f8f9fa;
    }

    .task-item:last-child {
        border-bottom: none;
    }

    .task-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 15px;
        font-size: 1.2rem;
    }

    .task-content h6 {
        margin: 0;
        font-weight: 600;
        color: #495057;
    }

    .task-content small {
        color: #6c757d;
    }

    .priority-high {
        background: #dc3545;
        color: white;
    }

    .priority-medium {
        background: #ffc107;
        color: #212529;
    }

    .priority-low {
        background: #28a745;
        color: white;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }

    .stat-card {
        background: linear-gradient(135deg, #1a1a1a 0%, #262626 100%); border: 1px solid #333;
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        text-align: center;
        transition: all 0.3s ease;
    }

    .stat-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .stat-icon {
        font-size: 2.5rem;
        margin-bottom: 15px;
    }

    .stat-value {
        font-size: 2rem;
        font-weight: 700;
        color: #007bff;
        margin: 0;
    }

    .stat-label {
        color: #6c757d;
        margin: 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- Dashboard content will be rendered here -->
    <div class="alert alert-info">
        <i class="fas fa-info-circle me-2"></i>
        This dashboard template needs to be completed with proper content.
    </div>
</div>
{% endblock %}
