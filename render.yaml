services:
  - type: web
    name: eduvision-cms
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn student_management_system.wsgi:application --bind 0.0.0.0:$PORT --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: student_management_system.settings
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: eduvision-cms.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://eduvision-cms.onrender.com
      - key: DATABASE_URL
        value: postgresql://postgres.yqwszaekwucrnnjuadtp:oiXsUCnflSlzH7zH@aws-1-ap-south-1.pooler.supabase.com:6543/postgres
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_HOST_USER
        value: 23404.cms@gmail.com
      - key: EMAIL_HOST_PASSWORD
        value: cuezzxokrxxzdnnv
      - key: EMAIL_USE_TLS
        value: True
      - key: DEFAULT_FROM_EMAIL
        value: EduVision <23404.cms@gmail.com>
      - key: EMAIL_TIMEOUT
        value: 10
    plan: free

